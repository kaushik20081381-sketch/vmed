{% extends "base_public.html" %}
{% block title %}Patient Login — MedTimeline AI{% endblock %}
{% block content %}
<div class="form-card">
  <h2>Patient Login</h2>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label>Username or Email</label><input type="text" name="username" required autofocus></div>
    <div class="field"><label>Password</label><input type="password" name="password" required></div>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>
  <p style="margin-top:16px; font-size:13.5px;">New here? <a href="{{ url_for('auth.patient_register') }}">Register as a patient</a></p>
</div>
{% endblock %}
