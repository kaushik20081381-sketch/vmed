{% extends "base_public.html" %}
{% block title %}Admin Login — MedTimeline AI{% endblock %}
{% block content %}
<div class="form-card">
  <h2>Admin Login</h2>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label>Username or Email</label><input type="text" name="username" required autofocus></div>
    <div class="field"><label>Password</label><input type="password" name="password" required></div>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>
  <p class="form-hint" style="margin-top:16px;">Admin accounts are created via the seed script, not self-registration.</p>
</div>
{% endblock %}
