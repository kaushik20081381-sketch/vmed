{% extends "base_public.html" %}
{% block title %}Patient Registration — MedTimeline AI{% endblock %}
{% block content %}
<div class="form-card wide">
  <h2>Create your patient account</h2>
  <p class="form-hint" style="margin-bottom:20px;">You'll receive a unique, permanent Patient ID after registering.</p>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field-row">
      <div class="field"><label>Full name</label><input type="text" name="full_name" value="{{ form.get('full_name','') }}" required></div>
      <div class="field"><label>Username</label><input type="text" name="username" value="{{ form.get('username','') }}" required></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Email</label><input type="email" name="email" value="{{ form.get('email','') }}" required></div>
      <div class="field"><label>Phone number</label><input type="text" name="phone" value="{{ form.get('phone','') }}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Date of birth</label><input type="date" name="date_of_birth" value="{{ form.get('date_of_birth','') }}" required></div>
      <div class="field"><label>Gender</label>
        <select name="gender">
          <option value="">Prefer not to say</option>
          <option value="Female">Female</option>
          <option value="Male">Male</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Password</label><input type="password" name="password" required></div>
      <div class="field"><label>Confirm password</label><input type="password" name="confirm_password" required></div>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Register</button>
  </form>
  <p style="margin-top:16px; font-size:13.5px;">Already registered? <a href="{{ url_for('auth.patient_login') }}">Log in</a></p>
</div>
{% endblock %}
